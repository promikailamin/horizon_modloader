[package]
name = "hmloader"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Precompiled mod loader (.hmmod) for Horizon, the Rust Minecraft client"
license = "MIT"
repository = "https://github.com/promikailamin/horizon_modloader"

[[bin]]
name = "hmloader"
path = "src/main.rs"

[lib]
name = "hmloader"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
